<!DOCTYPE html>
<html>
<head>
  <title>Generate GetPrimeGrade Favicons</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #1B2E4B; margin-bottom: 20px; }
    .preview {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .icon-box {
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px 0;
    }
    button {
      background: #1B2E4B;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin: 5px;
    }
    button:hover {
      background: #16253d;
    }
    .instructions {
      background: #f0f9ff;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GetPrimeGrade Favicon Generator</h1>

    <div class="instructions">
      <strong>Instructions:</strong>
      <ol>
        <li>Open this file in a browser</li>
        <li>Click the download buttons below each icon</li>
        <li>Save the files to the <code>public/</code> directory</li>
      </ol>
    </div>

    <div class="preview" id="preview"></div>
  </div>

  <script>
    const sizes = [
      { size: 16, name: 'favicon-16x16.png' },
      { size: 32, name: 'favicon-32x32.png' },
      { size: 180, name: 'apple-touch-icon.png' },
      { size: 192, name: 'android-chrome-192x192.png' },
      { size: 512, name: 'android-chrome-512x512.png' }
    ];

    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Navy background with rounded corners
      const cornerRadius = size * 0.1875; // 6/32 ratio
      ctx.fillStyle = '#1B2E4B';
      ctx.beginPath();
      ctx.moveTo(cornerRadius, 0);
      ctx.lineTo(size - cornerRadius, 0);
      ctx.quadraticCurveTo(size, 0, size, cornerRadius);
      ctx.lineTo(size, size - cornerRadius);
      ctx.quadraticCurveTo(size, size, size - cornerRadius, size);
      ctx.lineTo(cornerRadius, size);
      ctx.quadraticCurveTo(0, size, 0, size - cornerRadius);
      ctx.lineTo(0, cornerRadius);
      ctx.quadraticCurveTo(0, 0, cornerRadius, 0);
      ctx.closePath();
      ctx.fill();

      // White 'G' text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.625}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('G', size / 2, size / 2 + size * 0.05);

      return canvas;
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Generate all sizes
    const preview = document.getElementById('preview');
    sizes.forEach(({ size, name }) => {
      const canvas = drawIcon(size);

      const box = document.createElement('div');
      box.className = 'icon-box';

      const label = document.createElement('div');
      label.textContent = `${size}x${size}`;
      label.style.fontWeight = 'bold';
      label.style.marginBottom = '5px';

      const btn = document.createElement('button');
      btn.textContent = `Download ${name}`;
      btn.onclick = () => downloadCanvas(canvas, name);

      box.appendChild(label);
      box.appendChild(canvas);
      box.appendChild(document.createElement('br'));
      box.appendChild(btn);

      preview.appendChild(box);
    });
  </script>
</body>
</html>
